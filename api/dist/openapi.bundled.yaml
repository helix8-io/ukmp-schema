openapi: 3.1.0
info:
  title: UK Materials Passport Exchange API
  version: 1.0.0
  summary: Issue, retrieve, revise, verify and exchange UK Materials Passports between organisations.
  description: "The exchange plane of the UK Materials Passport (`ukmp`) infrastructure.\nAny conformant system — ERP, MES,\
    \ traceability platform, recycler\nportal or regulator tooling — can implement this interface. Passports\ncross organisational\
    \ boundaries, so every operation assumes the\nconsumer does **not** run the producer's software.\n\nInnovate UK project\
    \ 10188380 (National Materials Innovation Programme\nfeasibility study), WP2 deliverable **D2.1**. The reference\nimplementation\
    \ is D2.2; integration guides are D2.3.\n\n## Data model\n\nPassport payloads are defined by the published JSON Schema\n\
    (`schema/material_passport.schema.json`, referenced — not copied — by\nthis document). A passport is exchanged either\
    \ as a **bare passport**\n(a JSON-LD `ukmp:MaterialPassport` object) or wrapped in a\n**W3C Verifiable Credential Data\
    \ Model v2.0 envelope** with the passport\nas `credentialSubject`. Level 3 credentials are secured either by a\nJOSE enveloping\
    \ proof (compact JWS, `application/vc+jwt`, `alg: ES256`;\nthe preferred securing) or by an embedded Data Integrity proof\n\
    (`ecdsa-jcs-2019`).\n\n## Conformance levels\n\nLevels are per passport and machine-detectable; `POST /verify` reports\n\
    the level a document actually achieves.\n\n| Level | Name | Requires |\n|---|---|---|\n| 1 | Core | Schema-valid passport,\
    \ resolvable identifiers, self-declared claims |\n| 2 | Evidence-linked | Level 1 + every recycled-content claim traceable\
    \ to a traversable EPCIS 2.0 event chain; mass balance reconciles |\n| 3 | Verified | Level 2 + VC envelope whose proof\
    \ validates against the issuer's published key (`/.well-known/ukmp/keys`) and a status-list entry showing it is not revoked\
    \ |\n\nAn API implementation may serve passports of any level. An\nimplementation that claims Level 3 *verification* support\
    \ MUST accept\nboth securings on `POST /verify`.\n\n## Revisions versus successors\n\nPassports are **append-only**. A\
    \ *revision* corrects or updates the\nrecord for the **same subject** (same `passportId` lineage,\n`POST /passports/{passportKey}/revisions`).\
    \ A *successor* is a **new\npassport for a changed subject** after a lifecycle transition — for\nexample a battery repurposed\
    \ for stationary storage\n(`POST /passports/{passportKey}/successors`). Predecessor and\nsuccessor are linked both ways\
    \ through `lifecycle.predecessorRefs` /\n`lifecycle.successorRefs` (schema v0.2, field group B2).\n\n## Role-based access\
    \ tiers\n\nField-level disclosure follows the passport's `accessPolicy`\n(schema v0.2, field group B3) and the caller's\
    \ OAuth2 scope:\n\n| Scope held | Tiers disclosed |\n|---|---|\n| none (anonymous) or `passports:read` | `public` |\n\
    | `passports:read:legitimate-interest` | `public`, `legitimate-interest` |\n| `passports:read:authority` | all tiers |\n\
    \nWithheld members are **omitted**, and their JSON Pointers (relative to\n`credentialSubject`) are listed both in the\
    \ `UKMP-Withheld-Paths`\nresponse header and in the body's `ukmp:redaction` member. A redacted\nview cannot carry the\
    \ issuer's proof (the signed bytes have changed),\nso redacted views are served as unsigned `application/ld+json` only\
    \ and\nverify at most to Level 2. Passports with no `accessPolicy` (all v0.1\npassports) are wholly `public`. Selective-disclosure\
    \ credential formats\n(e.g. SD-JWT VC, aligned with EN 18239 / EN 18246 once cited) are a\ncandidate future mechanism\
    \ for signed partial disclosure; they are\n**not** normative in this version.\n\n## Why OpenAPI 3.1\n\nThe project application\
    \ referred to \"OpenAPI 3.0\". This specification\nuses **OpenAPI 3.1.0**, the current 3.x release, because 3.1 schema\n\
    objects are full JSON Schema 2020-12: the passport schema is referenced\ndirectly by `$ref` with no lossy down-conversion,\
    \ and webhooks are\ndescribed natively. Adopters whose tooling only reads a single file\nshould use the bundled form `api/dist/openapi.bundled.yaml`.\n\
    \n## Conventions\n\n* Errors use RFC 9457 `application/problem+json`.\n* `POST` operations that create resources accept\
    \ an `Idempotency-Key`\n  header; a replay with the same key and body returns the original\n  result, a replay with a\
    \ different body returns `409`.\n* Collections use opaque cursor pagination (`cursor`, `limit`) and an\n  RFC 8288 `Link:\
    \ <…>; rel=\"next\"` header.\n* Write operations on an existing passport require `If-Match` with the\n  current `ETag`\
    \ (optimistic concurrency).\n"
