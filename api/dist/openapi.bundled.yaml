        With `resolve=false` the network-dependent checks

        (`identifiers-resolve`, `proof-valid`, `status-not-revoked`,

        `time-anchor-valid`) are reported as `skip` and the achieved level is

        capped at 2.

        '
      security:
      - oauth2:
        - verify
      parameters:
      - name: resolve
        in: query
        description: Perform network-dependent checks (identifier resolution, key retrieval, status list fetch).
        schema:
          type: boolean
          default: true
      - name: targetLevel
        in: query
        description: Stop after evaluating the checks for this level. Checks above it are reported as `skip`.
        schema:
          $ref: '#/components/schemas/ConformanceLevel'
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/PassportDocument'
            examples:
              level3Credential:
                $ref: '#/components/examples/PassportCredentialHdpe'
              level1Bare:
                $ref: '#/components/examples/PassportBareLevel1'
          application/vc+jwt:
            schema:
              $ref: '#/components/schemas/CompactJws'
            examples:
              signedCredential:
                $ref: '#/components/examples/PassportJws'
      responses:
        '200':
          description: Verification report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReport'
              examples:
                evidenceLinkedProofFails:
                  $ref: '#/components/examples/VerificationReportLevel2'
                level1Pass:
                  $ref: '#/components/examples/VerificationReportLevel1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /exchanges:
    post:
      operationId: createExchange
      tags:
      - Exchange
      summary: Push a passport to a trading partner
      description: 'Delivers a passport to a trading partner''s goods-in endpoint (itself an

        implementation of this API, receiving via `exchange.received`) and tracks

        the delivery receipt. Links the despatch (SSCC, despatch advice, shipping

        event) to the partner''s goods-in. Delivery is asynchronous: the response is

        `202` with a receipt in state `queued`; poll `GET /exchanges/{exchangeId}`

        or supply `callbackUrl`. The passport is disclosed to the recipient at the

        stated `disclosureTier`, never above the sender''s own entitlement.

        '
      security:
      - oauth2:
        - exchange
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
            examples:
              despatchToConverter:
                $ref: '#/components/examples/ExchangeRequest'
      responses:
        '202':
          description: Exchange accepted for delivery.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeReceipt'
              examples:
                queued:
                  $ref: '#/components/examples/ExchangeReceiptQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /exchanges/{exchangeId}:
    parameters:
    - $ref: '#/components/parameters/ExchangeId'
    get:
      operationId: getExchange
      tags:
      - Exchange
      summary: Get an exchange and its delivery receipt
      description: Returns the current delivery state of an exchange, including the recipient's signed acknowledgement once
        received.
      security:
      - oauth2:
        - exchange
      responses:
        '200':
          description: Exchange state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeReceipt'
              examples:
                acknowledged:
                  $ref: '#/components/examples/ExchangeReceiptAcknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /.well-known/ukmp/keys:
    servers:
    - url: https://passports.example.org
      description: Well-known URIs are served from the origin root (RFC 8615), not under the API base path.
    get:
      operationId: getIssuerKeys
      tags:
      - Trust
      summary: Get the issuer's verification keys (JWKS)
      description: 'Publishes the issuer''s current and historical public verification keys

        as an RFC 7517 JWK Set. Retired keys stay published (with `ukmp:status:

        retired`) so passports signed before rotation remain verifiable. Keys

        are ECDSA P-256 (`ES256`); the same key material serves JOSE and

        `ecdsa-jcs-2019` Data Integrity proofs. Public, cacheable, no

        authentication.

        '
      security: []
      responses:
        '200':
          description: JWK Set.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/jwk-set+json:
              schema:
                $ref: '#/components/schemas/JwkSet'
              examples:
                currentAndRetired:
                  $ref: '#/components/examples/JwkSet'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /status/{listId}:
    parameters:
    - name: listId
      in: path
      required: true
      description: Status list identifier, as in the `statusListCredential` URL of a passport's `credentialStatus`.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
      example: '3'
    get:
      operationId: getStatusList
      tags:
      - Trust
      summary: Get a Bitstring Status List credential
      description: 'Returns the W3C Bitstring Status List credential referenced by passports''

        `credentialStatus.statusListCredential`. Verifiers decode `encodedList`

        (multibase base64url of a GZIP-compressed bitstring, minimum 16 KB) and

        test bit `statusListIndex`. Public, cacheable, no authentication; served

        signed (`application/vc+jwt`) where the issuer supports Level 3, otherwise

        as JSON-LD.

        '
      security: []
      externalDocs:
        description: W3C Bitstring Status List v1.0
        url: https://www.w3.org/TR/vc-bitstring-status-list/
      responses:
        '200':
          description: The status list credential.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/BitstringStatusListCredential'
              examples:
                revocationList:
                  $ref: '#/components/examples/StatusListCredential'
            application/vc+jwt:
              schema:
                $ref: '#/components/schemas/CompactJws'
              examples:
                signedList:
                  $ref: '#/components/examples/StatusListJws'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
webhooks:
  passport.revised:
    post:
      operationId: onPassportRevised
      tags:
      - Lifecycle
      summary: A passport you subscribe to has a new revision
      description: Sent to subscribers when a revision is appended. Fetch the new document with the `href` in `data`.
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassportRevisedEvent'
            examples:
              revised:
                $ref: '#/components/examples/WebhookPassportRevised'
      responses:
        '204':
          description: Received. Any 2xx acknowledges; other responses are retried with exponential backoff for up to 24 h.
  passport.revoked:
    post:
      operationId: onPassportRevoked
      tags:
      - Lifecycle
      summary: A passport you subscribe to was revoked or suspended
      description: Sent when a passport's status-list bit is set (revocation or suspension) or cleared (reinstatement of a
        suspension).
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassportRevokedEvent'
            examples:
              revoked:
                $ref: '#/components/examples/WebhookPassportRevoked'
      responses:
        '204':
          description: Received.
  passport.succeeded:
    post:
      operationId: onPassportSucceeded
      tags:
      - Lifecycle
      summary: A successor passport was issued
      description: Sent when a successor passport is issued for a subject after a lifecycle transition.
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassportSucceededEvent'
            examples:
              succeeded:
                $ref: '#/components/examples/WebhookPassportSucceeded'
      responses:
        '204':
          description: Received.
  exchange.received:
    post:
      operationId: onExchangeReceived
      tags:
      - Exchange
      summary: Inbound passport delivery (goods-in)
      description: 'Delivered by a sender''s `POST /exchanges` to the recipient''s goods-in

        endpoint. The recipient responds `200` with a signed receipt, which the

        sender surfaces in `ExchangeReceipt.acknowledgement`.

        '
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeReceivedEvent'
            examples:
              inbound:
                $ref: '#/components/examples/WebhookExchangeReceived'
      responses:
        '200':
          description: Received and acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAcknowledgement'
              examples:
                ack:
                  $ref: '#/components/examples/DeliveryAcknowledgement'
        '422':
          description: Rejected by the recipient (e.g. passport does not match the despatch). The sender records state `rejected`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                mismatch:
                  value:
                    type: https://schema.materialspassport.org.uk/problems/despatch-mismatch
                    title: Passport does not match despatch
                    status: 422
                    detail: LGTIN 05060987654321.B26-0803-HD is not on despatch advice DA-2026-08-0412.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'OAuth 2.0 client-credentials grant (system-to-system). Read scopes are

        hierarchical for disclosure purposes: `passports:read:authority`

        implies `passports:read:legitimate-interest` implies `passports:read`.

        '
      flows:
        clientCredentials:
          tokenUrl: https://passports.example.org/oauth2/token
          scopes:
            passports:read: Read passports — public tier only.
            passports:read:legitimate-interest: Read passports — public and legitimate-interest tiers.
            passports:read:authority: Read passports — all tiers (market-surveillance and enforcement authorities).
            passports:write: Create passports, append revisions, issue successors, change credential status.
            verify: Submit documents to the verifier.
            exchange: Push passports to trading partners and read delivery receipts.
  parameters:
    PassportKey:
      name: passportKey
      in: path
      required: true
      description: 'Server-assigned passport key (as returned in `Location`), or the

        passport''s `passportId` URI percent-encoded as a single path segment.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      example: urn:uuid:8f2b7c1e-4d3a-4f6b-9e2d-1a5c7b9d0e42
    ExchangeId:
      name: exchangeId
      in: path
      required: true
      description: Exchange identifier, as returned in `Location` by `POST /exchanges`.
      schema:
        type: string
        format: uuid
      example: 0b6f3c2a-91d4-4e8a-b7f0-5d2c9e1a4b36
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated unique key (UUID recommended) making the request safe to

        retry. Keys are retained for at least 24 hours.

        '
      schema:
        type: string
        minLength: 8
        maxLength: 255
      example: 6c1f7a2e-3b44-4c0e-9f51-8a7d2e0b9c13
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current `ETag` of the passport. Mismatch returns `412`; absence returns `428`.
      schema:
        type: string
      example: '"rev-2-sha256-9f2c41"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Conditional retrieval; returns `304` if the ETag is current.
      schema:
        type: string
      example: '"rev-2-sha256-9f2c41"'
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string
        maxLength: 512
      example: eyJrIjoiMjAyNi0wOC0wM1QxNDoyMjowMFoifQ
    Limit:
      name: limit
      in: query
      description: Maximum items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50
    WebhookSignature:
      name: UKMP-Webhook-Signature
      in: header
      required: true
      description: 'Detached compact JWS (RFC 7515 Appendix F) over the raw request body,

        signed with a key published at the sender''s `/.well-known/ukmp/keys`.

        Receivers MUST verify it before acting on the event.

        '
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+\.\.[A-Za-z0-9_-]+$
      example: eyJhbGciOiJFUzI1NiIsImtpZCI6IjIwMjYtMSIsImI2NCI6ZmFsc2UsImNyaXQiOlsiYjY0Il19..SUxMVVNUUkFUSVZFLVNJRw
  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
      example: /ukmp/v1/passports/urn:uuid:8f2b7c1e-4d3a-4f6b-9e2d-1a5c7b9d0e42
    ETag:
      description: Entity tag of the current revision; use with `If-Match` on writes.
      schema:
        type: string
      example: '"rev-2-sha256-9f2c41"'
    WithheldPaths:
      description: 'Comma-separated JSON Pointers (relative to `credentialSubject`) of members

        omitted because they exceed the caller''s access tier. Absent when nothing

        is withheld.

        '
      schema:
        type: string
      example: /composition/substances,/processingHistory
    Link:
      description: RFC 8288 pagination links (`rel="next"`).
      schema:
        type: string
      example: </ukmp/v1/passports?cursor=eyJrIjoiMjAyNi0wOC0wM1QxNDoyMjowMFoifQ&limit=50>; rel="next"
    CacheControl:
      description: Caching directives for public trust material.
      schema:
        type: string
      example: public, max-age=300
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
      example: 30
    RateLimit:
      description: Remaining quota and reset (IETF RateLimit header fields).
      schema:
        type: string
      example: '"default";r=0;t=30'
    WwwAuthenticate:
      description: OAuth 2.0 bearer challenge (RFC 6750).
      schema:
        type: string
      example: Bearer realm="ukmp", error="invalid_token"
  responses:
    BadRequest:
      description: Malformed request (syntax, parameter types, unparseable JSON).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            badParameter:
              value:
                type: https://schema.materialspassport.org.uk/problems/invalid-parameter
                title: Invalid query parameter
                status: 400
                detail: '''from'' must be an RFC 3339 date-time.'
                errors:
                - pointer: '#/query/from'
                  message: expected date-time, got '03/08/2026'
    Unauthorized:
      description: Missing or invalid access token.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidToken:
              value:
                type: https://schema.materialspassport.org.uk/problems/unauthorized
                title: Authentication required
                status: 401
                detail: The access token has expired.
    Forbidden:
      description: The token lacks the scope required for this operation, or the caller may not act on this resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingScope:
              value:
                type: https://schema.materialspassport.org.uk/problems/insufficient-scope
                title: Insufficient scope
                status: 403
                detail: This operation requires scope 'passports:write'.
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                type: https://schema.materialspassport.org.uk/problems/not-found
                title: Not found
                status: 404
                detail: No passport with key 'urn:uuid:00000000-0000-0000-0000-000000000000'.
    NotAcceptable:
      description: 'The requested media type cannot be served — e.g. `application/vc+jwt`

        requested by a caller whose tier would require fields to be withheld.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            signedUnavailable:
              value:
                type: https://schema.materialspassport.org.uk/problems/signed-view-unavailable
                title: Signed credential not available at this tier
                status: 406
                detail: Fields are withheld at tier 'public'; request application/ld+json for a redacted view.
    Conflict:
      description: Conflicts with current state (duplicate `passportId`, idempotency-key reuse with a different body, invalid
        status transition).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            duplicate:
              value:
                type: https://schema.materialspassport.org.uk/problems/duplicate-passport
                title: Passport already exists
                status: 409
                detail: passportId https://id.gs1.org/01/05060987654321/10/B26-0803-HD already exists; append a revision instead.
            revokedIsFinal:
              value:
                type: https://schema.materialspassport.org.uk/problems/invalid-status-transition
                title: Revocation is permanent
                status: 409
                detail: A revoked passport cannot be reinstated.
    PreconditionFailed:
      description: '`If-Match` does not match the current ETag — someone else revised the passport first.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            staleEtag:
              value:
                type: https://schema.materialspassport.org.uk/problems/stale-etag
                title: Precondition failed
                status: 412
                detail: Current ETag is "rev-3-sha256-a71b02".
    PreconditionRequired:
      description: '`If-Match` is required on writes to an existing passport.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingIfMatch:
              value:
                type: https://schema.materialspassport.org.uk/problems/if-match-required
                title: Precondition required
                status: 428
                detail: Supply If-Match with the passport's current ETag.
    UnsupportedMediaType:
      description: Request `Content-Type` is not supported by this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            wrongType:
              value:
                type: https://schema.materialspassport.org.uk/problems/unsupported-media-type
                title: Unsupported media type
                status: 415
                detail: Use application/ld+json or application/vc+jwt.
    UnprocessableContent:
      description: Well-formed but semantically invalid — fails the passport JSON Schema, or breaks a lifecycle rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            schemaInvalid:
              value:
                type: https://schema.materialspassport.org.uk/problems/schema-invalid
                title: Passport fails schema validation
                status: 422
                detail: 2 schema violations.
                errors:
                - pointer: /credentialSubject/recycledContent/totalRecycledFraction
                  message: 1.3 is greater than the maximum of 1
                - pointer: /credentialSubject/composition
                  message: '''substances'' is a required property'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            slowDown:
              value:
                type: https://schema.materialspassport.org.uk/problems/rate-limited
                title: Too many requests
                status: 429
                detail: Quota of 600 requests per minute exceeded.
  schemas:
    MaterialPassport:
      description: 'The `ukmp:MaterialPassport` object (credentialSubject), as defined by the

        published passport JSON Schema. Referenced, not copied: this document

        always uses the schema version in the same repository release.

        '
      $ref: '#/components/schemas/material_passport.schema'
    JsonLdContext:
      description: JSON-LD `@context` — a context IRI, an inline context, or an array of these.
      oneOf:
      - type: string
        format: uri
      - type: object
      - type: array
        minItems: 1
        items:
          oneOf:
          - type: string
            format: uri
          - type: object
    BarePassport:
      title: Bare passport
      description: A JSON-LD passport without a credential envelope (Levels 1–2).
      allOf:
      - $ref: '#/components/schemas/material_passport.schema'
      - type: object
        required:
        - '@context'
        properties:
          '@context':
            $ref: '#/components/schemas/JsonLdContext'
    PassportCredential:
      title: VC-enveloped passport
      description: 'W3C Verifiable Credential Data Model v2.0 envelope with the passport as

        `credentialSubject`. May carry an embedded Data Integrity proof

        (`ecdsa-jcs-2019`) — required for Level 3 when not JOSE-secured.

        '
      type: object
      required:
      - '@context'
      - type
      - issuer
      - credentialSubject
      properties:
        '@context':
          $ref: '#/components/schemas/JsonLdContext'
        id:
          type: string
          format: uri
        type:
          type: array
          contains:
            const: VerifiableCredential
          items:
            type: string
        issuer:
          oneOf:
          - type: string
            format: uri
          - type: object
            required:
            - id
            properties:
              id:
                type: string
                format: uri
              name:
                type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        credentialStatus:
          $ref: '#/components/schemas/BitstringStatusListEntry'
        credentialSubject:
          $ref: '#/components/schemas/material_passport.schema'
        proof:
          $ref: '#/components/schemas/DataIntegrityProof'
    PassportDocument:
      description: A passport as exchanged in JSON-LD — either bare or VC-enveloped.
      oneOf:
      - $ref: '#/components/schemas/PassportCredential'
      - $ref: '#/components/schemas/BarePassport'
    RedactedPassportView:
      title: Redacted (tier-filtered) view
      description: 'A passport from which members above the caller''s tier have been omitted.

        Carries `ukmp:redaction`, never an embedded `proof` (it would not verify),

        and need not satisfy the full passport schema''s `required` members.

        '
      type: object
      required:
      - '@context'
      - ukmp:redaction
      not:
        required:
        - proof
      properties:
        '@context':
          $ref: '#/components/schemas/JsonLdContext'
        ukmp:redaction:
          $ref: '#/components/schemas/Redaction'
        credentialSubject:
          type: object
          required:
          - type
          - passportId
          properties:
            type:
              const: ukmp:MaterialPassport
            passportId:
              type: string
              format: uri
    Redaction:
      type: object
      required:
      - tier
      - withheldPaths
      properties:
        tier:
          $ref: '#/components/schemas/AccessTier'
        withheldPaths:
          type: array
          description: JSON Pointers relative to `credentialSubject` (or document root for a bare passport).
          items:
            type: string
            pattern: ^(/[^/]*)+$
    PassportView:
      description: Response of `GET /passports/{passportKey}` as JSON-LD — full document, or redacted view.
      anyOf:
      - $ref: '#/components/schemas/PassportDocument'
      - $ref: '#/components/schemas/RedactedPassportView'
    CompactJws:
      description: 'JOSE-enveloped Verifiable Credential (or status list credential) as a

        compact JWS: `BASE64URL(header).BASE64URL(payload).BASE64URL(signature)`,

        header `alg: ES256`, `typ: vc+jwt`.

        '
      type: string
      pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
    DataIntegrityProof:
      type: object
      required:
      - type
      - cryptosuite
      - verificationMethod
      - proofPurpose
      - proofValue
      properties:
        type:
          const: DataIntegrityProof
        cryptosuite:
          type: string
          examples:
          - ecdsa-jcs-2019
        created:
          type: string
          format: date-time
        verificationMethod:
          type: string
          format: uri
        proofPurpose:
          type: string
          examples:
          - assertionMethod
        proofValue:
          type: string
    BitstringStatusListEntry:
      type: object
      required:
      - type
      - statusPurpose
      - statusListIndex
      - statusListCredential
      properties:
        id:
          type: string
          format: uri
        type:
          const: BitstringStatusListEntry
        statusPurpose:
          type: string
          enum:
          - revocation
          - suspension
        statusListIndex:
          type: string
          pattern: ^[0-9]+$
        statusListCredential:
          type: string
          format: uri
    ConformanceLevel:
      type: integer
      enum:
      - 1
      - 2
      - 3
    AccessTier:
      type: string
      enum:
      - public
      - legitimate-interest
      - authority
    IdentityLevel:
      type: string
      enum:
      - productType
      - batch
      - item
    LifecycleStatus:
      type: string
      enum:
      - original
      - prepared-for-reuse
      - reused
      - repurposed
      - remanufactured
      - waste
      - recycled
    CredentialState:
      type: string
      enum:
      - active
      - suspended
      - revoked
    EpcisEventType:
      type: string
      enum:
      - ObjectEvent
      - AggregationEvent
      - TransformationEvent
      - TransactionEvent
      - AssociationEvent
    Page:
      type: object
      required:
      - items
      - limit
      properties:
        items:
          type: array
        nextCursor:
          type:
          - string
          - 'null'
          description: Cursor for the next page; `null` on the last page.
        limit:
          type: integer
          minimum: 1
    PassportSummary:
      type: object
      required:
      - passportKey
      - passportId
      - subjectType
      - href
      - credentialStatus
      properties:
        passportKey:
          type: string
        passportId:
          type: string
          format: uri
        href:
          type: string
          format: uri-reference
        subjectType:
          type: string
        identityLevel:
          $ref: '#/components/schemas/IdentityLevel'
        gs1:gtin:
          type: string
        gs1:lgtin:
          type: string
        gs1:sgtin:
          type: string
        issueDate:
          type: string
          format: date
        lastUpdated:
          type: string
          format: date-time
        conformanceLevel:
          $ref: '#/components/schemas/ConformanceLevel'
        lifecycleStatus:
          $ref: '#/components/schemas/LifecycleStatus'
        credentialStatus:
          $ref: '#/components/schemas/CredentialState'
        currentRevision:
          type: integer
          minimum: 1
    PassportSummaryPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/PassportSummary'
    EpcisEvent:
      description: 'A GS1 EPCIS 2.0 event in the JSON-LD binding. Described loosely here;

        the normative definition is the EPCIS 2.0 JSON Schema. `ukmp:` extension

        members are permitted.

        '
      type: object
      required:
      - eventID
      - type
      properties:
        eventID:
          type: string
          format: uri
        type:
          $ref: '#/components/schemas/EpcisEventType'
        eventTime:
          type: string
          format: date-time
        bizStep:
          type: string
      additionalProperties: true
    EpcisEventPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          '@context':
            $ref: '#/components/schemas/JsonLdContext'
          passportId:
            type: string
            format: uri
          withheldCount:
            type: integer
            minimum: 0
            description: Events omitted because they exceed the caller's tier.
          items:
            type: array
            items:
              $ref: '#/components/schemas/EpcisEvent'
    RevisionReason:
      type: string
      enum:
      - correction
      - update
      - evidence-added
      - verification-added
      - succession-link
      - other
    RevisionRequest:
      type: object
      required:
      - passport
      - reason
      properties:
        passport:
          description: The complete new document (same `passportId`), JSON-LD or compact JWS.
          oneOf:
          - $ref: '#/components/schemas/PassportDocument'
          - $ref: '#/components/schemas/CompactJws'
        reason:
          $ref: '#/components/schemas/RevisionReason'
        changeSummary:
          type: string
          maxLength: 2000
    Revision:
      type: object
      required:
      - revision
      - passportId
      - createdAt
      - reason
      - href
      properties:
        revision:
          type: integer
          minimum: 1
        passportId:
          type: string
          format: uri
        supersedes:
          type:
          - integer
          - 'null'
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Client identifier that appended the revision.
        reason:
          $ref: '#/components/schemas/RevisionReason'
        changeSummary:
          type: string
        digest:
          type: string
          description: '`sha-256=:<base64>:` digest of the stored document (RFC 9530 syntax).'
        etag:
          type: string
        href:
          type: string
          format: uri-reference
    RevisionPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Revision'
    SuccessionRequest:
      type: object
      required:
      - lifecycleStatus
      - successor
      properties:
        lifecycleStatus:
          description: The lifecycle status of the successor subject (anything but `original`).
          allOf:
          - $ref: '#/components/schemas/LifecycleStatus'
          - not:
              const: original
        successor:
          description: The successor passport. Its `passportId` MUST differ from the predecessor's; the server adds the predecessor
            to `lifecycle.predecessorRefs`.
          oneOf:
          - $ref: '#/components/schemas/PassportDocument'
          - $ref: '#/components/schemas/CompactJws'
        transitionEventID:
          type: string
          format: uri
          description: EPCIS event recording the transition (e.g. the TransformationEvent that consumed the predecessor).
        effectiveAt:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 2000
    SuccessionResult:
      type: object
      required:
      - predecessor
      - successor
      - linkedAt
      properties:
        predecessor:
          $ref: '#/components/schemas/PassportLink'
        successor:
          $ref: '#/components/schemas/PassportLink'
        lifecycleStatus:
          $ref: '#/components/schemas/LifecycleStatus'
        predecessorRevision:
          type: integer
          minimum: 1
          description: The predecessor revision that added the successor to `lifecycle.successorRefs`.
        linkedAt:
          type: string
          format: date-time
    PassportLink:
      type: object
      required:
      - passportId
      - href
      properties:
        passportId:
          type: string
          format: uri
        href:
          type: string
          format: uri-reference
    StatusUpdate:
      type: object
      required:
      - action
      - reason
      properties:
        action:
          type: string
          enum:
          - revoke
          - suspend
          - reinstate
        reason:
          type: string
          enum:
          - recall
          - withdrawal
          - issued-in-error
          - compromised-key
          - under-investigation
          - other
        detail:
          type: string
          maxLength: 2000
        effectiveAt:
          type: string
          format: date-time
          description: Defaults to the time of the request. Future dates are not permitted.
    PassportStatus:
      type: object
      required:
      - passportId
      - status
      - updatedAt
      properties:
        passportId:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/CredentialState'
        reason:
          type: string
        credentialStatus:
          type: array
          items:
            $ref: '#/components/schemas/BitstringStatusListEntry'
        updatedAt:
          type: string
          format: date-time
    CheckResult:
      type: object
      required:
      - check
      - level
      - result
      properties:
        check:
          type: string
          enum:
          - schema-valid
          - identifiers-resolve
          - recycled-fraction-arithmetic
          - evidence-traceable
          - genealogy-traversable
          - mass-balance-reconciles
          - proof-valid
          - status-not-revoked
          - time-anchor-valid
        level:
          $ref: '#/components/schemas/ConformanceLevel'
        result:
          type: string
          enum:
          - pass
          - fail
          - skip
        optional:
          type: boolean
          default: false
          description: Optional checks do not gate the level (e.g. time anchoring where not configured).
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
              message:
                type: string
    VerificationReport:
      type: object
      required:
      - reportId
      - verifiedAt
      - result
      - achievedLevel
      - checks
      properties:
        reportId:
          type: string
          format: uri
        verifiedAt:
          type: string
          format: date-time
        verifier:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
            schemaId:
              type: string
              format: uri
        passportId:
          type: string
          format: uri
        securing:
          type: string
          enum:
          - jose
          - data-integrity
          - none
        declaredLevel:
          $ref: '#/components/schemas/ConformanceLevel'
        achievedLevel:
          description: Highest level whose non-optional checks all pass; `null` if Level 1 is not achieved.
          type:
          - integer
          - 'null'
          enum:
          - 1
          - 2
          - 3
          - null
        result:
          type: string
          enum:
          - pass
          - fail
          description: '`pass` iff `achievedLevel` ≥ `declaredLevel` (or ≥ 1 where no level is declared).'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
        warnings:
          type: array
          items:
            type: string
    PartyRef:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        gs1:gln:
          type: string
          pattern: ^[0-9]{13}$
        endpoint:
          type: string
          format: uri
          description: Base URL of the partner's implementation of this API.
    ExchangeRequest:
      type: object
      required:
      - passport
      - recipient
      properties:
        passport:
          description: Passport to send — by local key/URL, or by `passportId`.
          type: object
          minProperties: 1
          properties:
            href:
              type: string
              format: uri-reference
            passportId:
              type: string
              format: uri
        recipient:
          allOf:
          - $ref: '#/components/schemas/PartyRef'
          - required:
            - endpoint
        despatch:
          type: object
          properties:
            sscc:
              type: string
              pattern: ^[0-9]{18}$
            despatchAdviceId:
              type: string
            shippingEventID:
              type: string
              format: uri
            expectedDeliveryDate:
              type: string
              format: date
        disclosureTier:
          $ref: '#/components/schemas/AccessTier'
        mediaType:
          type: string
          enum:
          - application/ld+json
          - application/vc+jwt
          default: application/vc+jwt
        callbackUrl:
          type: string
          format: uri
    ExchangeReceipt:
      type: object
      required:
      - exchangeId
      - status
      - passportId
      - recipient
      - createdAt
      properties:
        exchangeId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - delivered
          - acknowledged
          - rejected
          - failed
        passportId:
          type: string
          format: uri
        recipient:
          $ref: '#/components/schemas/PartyRef'
        disclosureTier:
          $ref: '#/components/schemas/AccessTier'
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        attempts:
          type: integer
          minimum: 0
        acknowledgement:
          $ref: '#/components/schemas/DeliveryAcknowledgement'
        lastError:
          $ref: '#/components/schemas/Problem'
    DeliveryAcknowledgement:
      type: object
      required:
      - receivedAt
      - receivedBy
      - digest
      properties:
        receivedAt:
          type: string
          format: date-time
        receivedBy:
          $ref: '#/components/schemas/PartyRef'
        goodsInEventID:
          type: string
          format: uri
          description: The recipient's EPCIS `receiving` ObjectEvent linking despatch to goods-in.
        digest:
          type: string
          description: Digest of the document received (RFC 9530 syntax).
        signature:
          $ref: '#/components/schemas/CompactJws'
    Jwk:
      type: object
      required:
      - kty
      - crv
      - x
      - y
      - kid
      properties:
        kty:
          const: EC
        crv:
          const: P-256
        x:
          type: string
        y:
          type: string
        kid:
          type: string
        use:
          const: sig
        alg:
          const: ES256
        ukmp:status:
          type: string
          enum:
          - current
          - retired
          - compromised
        ukmp:validFrom:
          type: string
          format: date-time
        ukmp:validUntil:
          type: string
          format: date-time
    JwkSet:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
    BitstringStatusListCredential:
      type: object
      required:
      - '@context'
      - type
      - issuer
      - credentialSubject
      properties:
        '@context':
          $ref: '#/components/schemas/JsonLdContext'
        id:
          type: string
          format: uri
        type:
          type: array
          allOf:
          - contains:
              const: VerifiableCredential
          - contains:
              const: BitstringStatusListCredential
          items:
            type: string
        issuer:
          type: string
          format: uri
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        credentialSubject:
          type: object
          required:
          - type
          - statusPurpose
          - encodedList
          properties:
            id:
              type: string
              format: uri
            type:
              const: BitstringStatusList
            statusPurpose:
              type: string
              enum:
              - revocation
              - suspension
            encodedList:
              type: string
              pattern: ^u[A-Za-z0-9_-]+$
            ttl:
              type: integer
              minimum: 0
    WebhookEvent:
      type: object
      required:
      - id
      - type
      - occurredAt
      - source
      - data
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - passport.revised
          - passport.revoked
          - passport.succeeded
          - exchange.received
        occurredAt:
          type: string
          format: date-time
        source:
          type: string
          format: uri
          description: Base URL of the sending implementation (its keys are at `/.well-known/ukmp/keys` on that origin).
        data:
          type: object
    PassportRevisedEvent:
      allOf:
      - $ref: '#/components/schemas/WebhookEvent'
      - type: object
        properties:
          type:
            const: passport.revised
          data:
            $ref: '#/components/schemas/Revision'
    PassportRevokedEvent:
      allOf:
      - $ref: '#/components/schemas/WebhookEvent'
      - type: object
        properties:
          type:
            const: passport.revoked
          data:
            $ref: '#/components/schemas/PassportStatus'
    PassportSucceededEvent:
      allOf:
      - $ref: '#/components/schemas/WebhookEvent'
      - type: object
        properties:
          type:
            const: passport.succeeded
          data:
            $ref: '#/components/schemas/SuccessionResult'
    ExchangeReceivedEvent:
      allOf:
      - $ref: '#/components/schemas/WebhookEvent'
      - type: object
        properties:
          type:
            const: exchange.received
          data:
            type: object
            required:
            - exchangeId
            - sender
            - passport
            properties:
              exchangeId:
                type: string
                format: uuid
              sender:
                $ref: '#/components/schemas/PartyRef'
              despatch:
                type: object
                properties:
                  sscc:
                    type: string
                  despatchAdviceId:
                    type: string
                  shippingEventID:
                    type: string
              passport:
                description: The delivered passport (compact JWS or JSON-LD).
                oneOf:
                - $ref: '#/components/schemas/CompactJws'
                - $ref: '#/components/schemas/PassportView'
    Problem:
      description: RFC 9457 problem details.
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          description: Field-level errors; `pointer` is a JSON Pointer into the request body, or `#/query/<name>` / `#/header/<name>`
            for parameters.
          items:
            type: object
            required:
            - message
            properties:
              pointer:
                type: string
              message:
                type: string
      additionalProperties: true
    accessTier:
      enum:
      - public
      - legitimate-interest
      - authority
      description: 'B3 (v0.2). Cumulative access tiers: public ⊂ legitimate-interest ⊂ authority.'
    jsonPointer:
      type: string
      pattern: ^(/([^~/]|~[01])*)*$
      description: RFC 6901 JSON Pointer, evaluated against the credentialSubject (the passport object) in its JSON form as
        issued. A pointer to an object or array covers everything beneath it.
    postalAddress:
      type: object
      description: B5 (v0.2). Postal address of a party (schema.org PostalAddress shape).
      properties:
        streetAddress:
          type: string
        locality:
          type: string
        region:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 country code, e.g. 'GB'.
    contactPoint:
      type: object
      description: B5 (v0.2). Electronic contact details of a party.
      properties:
        email:
          type: string
          format: email
        telephone:
          type: string
        url:
          type: string
          format: uri
    party:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        gs1:gln:
          type: string
          pattern: ^[0-9]{13}$
        otherPartyId:
          type: object
          required:
          - scheme
          - value
          description: Operator identifier beyond GLN — EN 18219:2026 recognises schemes including the GLEIF LEI; registry
            access under Implementing Regulation (EU) 2026/1778 ties to verified operator identity.
          properties:
            scheme:
              type: string
              examples:
              - lei
              - companies-house
              - duns
            value:
              type: string
        role:
          enum:
          - producer
          - collector
          - sorter
          - reprocessor
          - compounder
          - converter
          - manufacturer
          - brand
          - verifier
          - importer
          - authorised-representative
          - distributor
          - economic-operator
          - other
          description: '''importer'', ''authorised-representative'', ''distributor'' and ''economic-operator'' added in v0.2
            (B5).'
        address:
          $ref: '#/components/schemas/postalAddress'
        contactPoint:
          $ref: '#/components/schemas/contactPoint'
    recycledContentClaim:
      type: object
      required:
      - totalRecycledFraction
      - calculationMethod
      - evidenceType
      - verificationStatus
      properties:
        preConsumerFraction:
          type: number
          minimum: 0
          maximum: 1
        postConsumerFraction:
          type: number
          minimum: 0
          maximum: 1
        totalRecycledFraction:
          type: number
          minimum: 0
          maximum: 1
        calculationMethod:
          enum:
          - mass-balance
          - batch-segregation
          - controlled-blending
          - declared
        chainOfCustodyModel:
          enum:
          - identity-preserved
          - segregated
          - mass-balance
          - book-and-claim
        evidenceType:
          enum:
          - epcis-event-chain
          - third-party-certificate
          - supplier-declaration
        evidenceRefs:
          type: array
          items:
            type: string
            format: uri-reference
        verificationStatus:
          enum:
          - self-declared
          - evidence-linked
          - independently-verified
        verifierParty:
          $ref: '#/components/schemas/party'
        feedstockSource:
          enum:
          - post-consumer-packaging
          - post-consumer-bottle
          - post-consumer-textile
          - post-industrial
          - post-industrial-textile
          - mixed
          - other
          description: v0.2, optional, sector-neutral. Origin class of the recycled feedstock. Separates bottle, other packaging
            and textile feedstock (needed by the textiles profile and bottle-to-fibre claims); 'mixed' where more than one
            class contributes materially.
      allOf:
      - if:
          properties:
            verificationStatus:
              const: independently-verified
        then:
          required:
          - verifierParty
      - if:
          properties:
            evidenceType:
              const: epcis-event-chain
        then:
          required:
          - evidenceRefs
    declaredUnit:
      type: object
      required:
      - quantity
      - unit
      description: B6 (v0.2). Declared or functional unit to which carbonFootprintPerDeclaredUnit and indicators refer, e.g.
        1 kWh of total energy over service life (batteries), 1 m of pipe (construction), 1 kg.
      properties:
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
          examples:
          - kWh
          - m
          - kg
          - m2
          - item
        description:
          type: string
    lcaIndicator:
      type: object
      required:
      - indicator
      - value
      - unit
      description: B7 (v0.2). One impact-indicator result, optionally for one life-cycle stage or module. Values refer to
        lcaSummary.declaredUnit when present, otherwise to 1 kg.
      properties:
        indicator:
          type: string
          description: Indicator code. EN 15804+A2 codes RECOMMENDED; PEF impact categories permitted.
          examples:
          - GWP-total
          - GWP-fossil
          - GWP-biogenic
          - GWP-luluc
          - ODP
          - AP
          - EP-freshwater
          - EP-marine
          - EP-terrestrial
          - POCP
          - ADP-mm
          - ADP-fossil
          - WDP
        lifecycleStage:
          type: string
          description: EN 15804 module (A1-A3, A4, A5, B1-B7, C1-C4, D) or battery carbon-footprint stage (raw-material, production,
            distribution, end-of-life). Absent ⇒ total over assessmentBoundary.
          examples:
          - A1-A3
          - A4
          - A5
          - B1
          - C1
          - C2
          - C3
          - C4
          - D
          - raw-material
          - production
          - distribution
          - end-of-life
        value:
          type: number
        unit:
          type: string
          examples:
          - kg CO2e
          - kg CFC-11e
          - mol H+e
          - kg Pe
          - kg Ne
          - mol Ne
          - kg NMVOCe
          - kg Sbe
          - MJ
          - m3 world eq. deprived
    identityLevel:
      enum:
      - productType
      - batch
      - item
      description: 'B1 (v0.2). Granularity of the passport subject: a product type / model (one passport per type, e.g. construction
        products under Reg (EU) 2024/3110), a batch / lot, or a serialised individual item (e.g. batteries under Reg (EU)
        2023/1542 Art 77). Optional; when absent it is interpreted from subjectType.'
    aggregation:
      type: object
      description: 'B1 (v0.2). Physical containment links between passported subjects. parentRefs: passports of what this
        subject is contained in; childRefs: passports of what it contains (e.g. module serials in a pack; a pack in a stationary
        storage system). Material transformation (e.g. pack → black-mass lot) is NOT aggregation — it stays an EPCIS TransformationEvent.'
      properties:
        parentRefs:
          type: array
          items:
            type: string
            format: uri
          uniqueItems: true
          description: Passport URIs of containing subjects (contained-in).
        childRefs:
          type: array
          items:
            type: string
            format: uri
          uniqueItems: true
          description: Passport URIs of contained subjects (contains).
    composition:
      type: object
      required:
      - materialFamily
      - substances
      properties:
        materialFamily:
          enum:
          - polymer
          - metal
          - glass
          - fibre
          - mineral
          - composite
          - other
        substances:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - name
            - massFraction
            properties:
              name:
                type: string
              casNumber:
                type: string
              ecNumber:
                type: string
              massFraction:
                type: number
                minimum: 0
                maximum: 1
              svhcFlag:
                type: boolean
      additionalProperties: true
    processingHistory:
      type: object
      required:
      - epcisEvents
      properties:
        epcisEvents:
          type: array
          items:
            type: object
            required:
            - eventID
            - type
            - bizStep
            - eventTime
            properties:
              eventID:
                type: string
              type:
                enum:
                - ObjectEvent
                - TransformationEvent
                - AggregationEvent
                - AssociationEvent
              bizStep:
                type: string
              eventTime:
                type: string
                format: date-time
              ukmp:massBalanceDelta:
                type: object
                required:
                - inputKg
                - outputKg
                properties:
                  inputKg:
                    type: number
                    minimum: 0
                  outputKg:
                    type: number
                    minimum: 0
                  wasteKg:
                    type: number
                    minimum: 0
              ukmp:verificationExtension:
                type: object
                properties:
                  instrument:
                    type: string
                  measuredPolymerClass:
                    type: string
                  contaminationLevel:
                    type: number
                    minimum: 0
                    maximum: 1
            additionalProperties: true
        traversable:
          type: boolean
    lcaSummary:
      type: object
      required:
      - assessmentBoundary
      - methodology
      anyOf:
      - required:
        - carbonFootprintKgCo2ePerKg
      - required:
        - carbonFootprintPerDeclaredUnit
      dependentRequired:
        carbonFootprintPerDeclaredUnit:
        - declaredUnit
      properties:
        carbonFootprintKgCo2ePerKg:
          type: number
          minimum: 0
        assessmentBoundary:
          enum:
          - cradle-to-gate
          - gate-to-gate
          - cradle-to-grave
        methodology:
          type: string
        dataQualityRating:
          type: integer
          minimum: 1
          maximum: 5
        primaryDataFraction:
          type: number
          minimum: 0
          maximum: 1
        energySource:
          type: object
          properties:
            gridKwh:
              type: number
              minimum: 0
            onSiteRenewablesKwh:
              type: number
              minimum: 0
        virginBaselineKgCo2ePerKg:
          type: object
          required:
          - value
          - source
          properties:
            value:
              type: number
              minimum: 0
            unit:
              type: string
            source:
              type: string
            assessmentBoundary:
              enum:
              - cradle-to-gate
              - gate-to-gate
              - cradle-to-grave
        netAvoidedKgCo2ePerKg:
          type: number
        declaredUnit:
          $ref: '#/components/schemas/declaredUnit'
        carbonFootprintPerDeclaredUnit:
          type: number
          minimum: 0
          description: B6 (v0.2). Carbon footprint in kg CO2e per declaredUnit. Requires declaredUnit.
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/lcaIndicator'
          description: B7 (v0.2). Multi-indicator, per-module results. EN 15804 module D MUST be carried here, never in netAvoidedKgCo2ePerKg.
        studyRefs:
          type: array
          items:
            type: string
            format: uri-reference
          description: B8 (v0.2). LCA / carbon-footprint study, EPD or calculation-parameter documents.
        verifierParty:
          $ref: '#/components/schemas/party'
          description: B8 (v0.2). Independent verifier of the LCA study or EPD.
    ukRegulatoryData:
      type: object
      properties:
        ewcCode:
          type: string
          pattern: ^[0-9]{2} [0-9]{2} [0-9]{2}\*?$
        endOfWasteStatus:
          type: object
          required:
          - achieved
          properties:
            achieved:
              type: boolean
            basis:
              enum:
              - quality-protocol
              - individual-assessment
              - not-applicable
            atEvent:
              type: string
        wasteHierarchyPosition:
          enum:
          - preparation-for-reuse
          - recycling
          - recovery
        recoveryCode:
          type: string
          pattern: ^R[0-9]{1,2}$
        pptStatus:
          type: object
          required:
          - inScope
          properties:
            inScope:
              type: boolean
            recycledFractionForPpt:
              type: number
              minimum: 0
              maximum: 1
            evidenceRef:
              type: string
        eprCategory:
          type: string
        permits:
          type: array
          items:
            type: object
            required:
            - type
            - ref
            properties:
              type:
                type: string
              ref:
                type: string
        euMapping:
          type: object
          properties:
            esprCategory:
              type: string
            ppwrRecyclabilityGrade:
              type: string
    lifecycle:
      type: object
      description: B2 (v0.2). Lifecycle state and passport succession. A REVISION corrects or updates the same subject (append-only,
        same passportId; API /revisions). A SUCCESSOR is a new passport, with a new passportId, for a subject changed by a
        lifecycle transition (e.g. repurposing; API /successors), linked both ways via predecessorRefs / successorRefs. Absent
        ⇒ status 'original'.
      properties:
        status:
          enum:
          - original
          - prepared-for-reuse
          - reused
          - repurposed
          - remanufactured
          - waste
          - recycled
          default: original
        predecessorRefs:
          type: array
          items:
            type: string
            format: uri
          uniqueItems: true
          description: Passport URI(s) this passport succeeds. Expected whenever status is not 'original'.
        successorRefs:
          type: array
          items:
            type: string
            format: uri
          uniqueItems: true
          description: Passport URI(s) that succeed this one (added by revision when a successor is issued).
        statusChangedAt:
          type: string
          format: date-time
    accessPolicy:
      type: object
      description: B3 (v0.2). Role-based, field-level access tiers. Fields not covered by fieldTiers take defaultTier (default
        'public'). Exchange APIs enforce tiers by OAuth2 scope and omit withheld fields, listing their pointers as withheldPaths.
      properties:
        defaultTier:
          $ref: '#/components/schemas/accessTier'
          default: public
        fieldTiers:
          type: array
          items:
            type: object
            required:
            - path
            - tier
            properties:
              path:
                $ref: '#/components/schemas/jsonPointer'
              tier:
                $ref: '#/components/schemas/accessTier'
            additionalProperties: false
      additionalProperties: false
    recycledContentDetail:
      description: B9 (v0.2). A recycled-content claim scoped to one material, component or layer. Same fields and rules as
        recycledContentClaim, plus a mandatory scope.
      allOf:
      - $ref: '#/components/schemas/recycledContentClaim'
      required:
      - scope
      properties:
        scope:
          type: object
          minProperties: 1
          properties:
            material:
              type: string
              description: Element symbol (e.g. 'Ni', 'Co', 'Li', 'Pb'), ISO 1043 polymer code, material name or CAS number.
            componentRef:
              type: string
              description: 'The component: a JSON Pointer into this passport (e.g. ''/composition/substances/0'') or the URI
                of the component''s own passport.'
            layer:
              type: string
              description: Layer of a multilayer product, e.g. 'outer', 'core', 'inner'.
    fieldStatusEntry:
      type: object
      required:
      - path
      - status
      description: B4 (v0.2). Applicability status of one field.
      properties:
        path:
          $ref: '#/components/schemas/jsonPointer'
        status:
          enum:
          - required
          - optional
          - conditional
          - not-yet-applicable
        basis:
          type: string
          description: Legal or standards basis, e.g. 'Reg (EU) 2023/1542 Art 7 — methodology act not adopted'.
        reviewBy:
          type: string
          format: date
          description: Date by which the status should be re-assessed.
      additionalProperties: false
    material_passport.schema:
      title: UK Materials Passport (ukmp:MaterialPassport) v0.2
      description: 'Validation schema for the credentialSubject of a UK Materials Passport. WP1 deliverable D1.2, project
        10188380. v0.2 adds the WP3 baseline core extensions B1 (multi-level identity), B2 (passport succession / lifecycle),
        B3 (role-based field-level access tiers) and B4 (per-field applicability status), plus the optional recycledContent.feedstockSource.
        Strictly additive: every valid v0.1 passport remains valid. Draft for steering review.'
      type: object
      required:
      - type
      - passportId
      - subjectType
      - issuerParty
      - issueDate
      - composition
      - recycledContent
      properties:
        type:
          const: ukmp:MaterialPassport
        passportId:
          type: string
          format: uri
        subjectType:
          enum:
          - MaterialBatch
          - Product
          - Component
          - ProductType
          - Item
          description: What the passport describes. 'ProductType' and 'Item' added in v0.2 (B1). Granularity is stated explicitly
            by identityLevel; when identityLevel is absent it is interpreted from subjectType (MaterialBatch ⇒ batch, ProductType
            ⇒ productType, Item ⇒ item; Product / Component ⇒ unspecified).
        identityLevel:
          $ref: '#/components/schemas/identityLevel'
        gs1:gtin:
          type: string
          pattern: ^[0-9]{8,14}$
        gs1:lgtin:
          type: string
        gs1:sgtin:
          type: string
          pattern: ^[0-9]{8,14}\.[!-~]{1,20}$
          description: B1 (v0.2). Serialised GTIN of an individual item, written '<GTIN>.<serial>' (same dotted convention
            as gs1:lgtin). The serial is 1–20 printable ASCII characters — a superset of the GS1 AI (21) character set 82;
            issuers SHOULD restrict serials to CSET 82. Satisfies the identifier requirement.
        productTypeRef:
          type: string
          format: uri
          description: B1 (v0.2). passportId of the product-type passport this batch or item instantiates. Type-level data
            is inherited by reference, not copied.
        aggregation:
          $ref: '#/components/schemas/aggregation'
        alternativeId:
          type: object
          required:
          - scheme
          - value
          properties:
            scheme:
              type: string
              description: Identifier scheme. EN 18219:2026 permitted product-identifier schemes are recommended for EU DPP
                registry registrability; other schemes remain valid.
              examples:
              - gs1-digital-link
              - iec-61406
              - did
              - doi
            value:
              type: string
        sectorProfile:
          type: string
          format: uri
        conformanceLevel:
          enum:
          - 1
          - 2
          - 3
        issuerParty:
          $ref: '#/components/schemas/party'
        issueDate:
          type: string
          format: date
        lastUpdated:
          type: string
          format: date-time
        description:
          type: string
        composition:
          $ref: '#/components/schemas/composition'
        recycledContent:
          $ref: '#/components/schemas/recycledContentClaim'
        processingHistory:
          $ref: '#/components/schemas/processingHistory'
        environmentalFootprint:
          $ref: '#/components/schemas/lcaSummary'
        ukRegulatory:
          $ref: '#/components/schemas/ukRegulatoryData'
        lifecycle:
          $ref: '#/components/schemas/lifecycle'
        accessPolicy:
          $ref: '#/components/schemas/accessPolicy'
        parties:
          type: array
          items:
            $ref: '#/components/schemas/party'
          description: B5 (v0.2). Parties other than the issuer (manufacturer, importer, authorised representative, distributor,
            …), each with its role.
        recycledContentDetail:
          type: array
          items:
            $ref: '#/components/schemas/recycledContentDetail'
          description: B9 (v0.2). Recycled-content claims scoped by material, component or layer (e.g. per-metal shares for
            batteries, per-layer for multilayer pipe). The aggregate recycledContent is unchanged and still required.
        fieldStatus:
          type: array
          items:
            $ref: '#/components/schemas/fieldStatusEntry'
          description: 'B4 (v0.2). Per-field applicability status: for named fields, whether they are required, optional,
            conditional or not yet applicable, and on what legal or standards basis. Lets a passport state honestly that an
            obligation is pending (e.g. a methodology act not yet adopted) rather than leaving a silent gap.'
      anyOf:
      - required:
        - gs1:gtin
      - required:
        - gs1:lgtin
      - required:
        - gs1:sgtin
      - required:
        - alternativeId
      x-ukmp-schema-id: https://schema.materialspassport.org.uk/v0.2/material_passport.schema.json
